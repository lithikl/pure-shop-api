name: Deploy Noirknull to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Cloudflare deploy attempt $attempt/3"
            if npx --yes wrangler@4.153.0 deploy; then
              echo "Cloudflare deploy succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "Cloudflare deploy failed after 3 attempts."
          exit 1

# Trigger Cloudflare deployment for every main branch update.
# CORS compatibility update.
# Product rails and category controls.
# Secrets configured for automated Cloudflare deployment.
